name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write

env:
  CGO_ENABLED: 0
  BINARY_NAME: m365-copilot2api

jobs:
  package:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: "386"
          - goos: linux
            goarch: arm
          - goos: linux
            goarch: s390x
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: "386"
          - goos: android
            goarch: arm64
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: freebsd
            goarch: riscv64
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          suffix=""
          if [ "${GOOS}" = "windows" ]; then suffix=".exe"; fi
          output="dist/${BINARY_NAME}-${GOOS}-${GOARCH}${suffix}"
          version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse --short HEAD)"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X m365-copilot2api/internal/web.Version=${version} -X m365-copilot2api/internal/web.Commit=${commit} -X m365-copilot2api/internal/web.BuildTime=${build_time}"
          go build -trimpath -ldflags="${ldflags}" -o "${output}" ./cmd/server

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: package
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ${{ env.BINARY_NAME }}-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Resolve release tag
        id: tag
        env:
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then tag="${INPUT_TAG}"; fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/*

  update-readme:
    name: Update README download links
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record the release in internal/web/VERSION
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          file="internal/web/VERSION"
          # This file is compiled into the binary and is the badge's last line of
          # defence when a build carries neither -ldflags nor vcs metadata.
          # Keeping it equal to the newest release means every build path reports
          # the right number without anyone bumping it by hand.
          printf '%s\n' "${version}" > "${file}"
          if git diff --quiet -- "${file}"; then
            echo "${file} already reads ${version}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${file}"
          git commit -m "chore(version): record release ${TAG} in internal/web/VERSION"
          git push origin HEAD:main

      - name: Update README version badge and download table
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Updating README for ${TAG} (version ${TAG#v})"

          if grep -q "DOWNLOAD_TABLE_START" README.md; then
            python3 << 'PYEOF'
          import os, re
          tag = os.environ.get("TAG", "").strip()
          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r"/releases/download/v[0-9]+\.[0-9]+\.[0-9]+/", f"/releases/download/{tag}/", content)
          content = re.sub(r"(releases/tag/)v[0-9]+\.[0-9]+\.[0-9]+", rf"\g<1>{tag}", content)
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)
          print(f"Patched README download URLs to {tag}")
          PYEOF
          else
            echo "No DOWNLOAD_TABLE markers found, skipping table regeneration"
          fi

          if git diff --quiet README.md; then
            echo "README already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README download links for ${TAG}"
          git push origin HEAD:main