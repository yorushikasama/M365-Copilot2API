name: CI
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

  # The race detector needs cgo, which is unavailable on the maintainer's
  # Windows box, so this job is the only place concurrency bugs get caught.
  # The codebase leans on shared state (connection pool, account health, the
  # global circuit breaker, background persist/GC loops), and audits of it keep
  # surfacing suspected races that only the detector can settle.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  # There was no static-analysis gate at all: gofmt + vet + test only. vet is
  # deliberately narrow, so ineffectual assignments, unchecked errors and dead
  # code all passed CI. Failures are advisory-free on purpose -- the job is
  # meant to block, otherwise it becomes noise nobody reads.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # Pinned, not "latest": the config below is verified against this
          # version, and a linter bump can turn a green tree red without a
          # single code change.
          version: v2.13.2
